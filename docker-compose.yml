# Hoardware: PostgreSQL 18 + FastAPI backend + Next.js frontend.
#
#   cp .env.example .env     # optional; every value has a working default
#   docker compose up -d --build
#
# Only the frontend publishes a port. The backend is reachable solely on the
# internal network, through the Next.js proxy at /api/*.

x-backend-env: &backend-env
  TZ: ${TZ:-UTC}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hoardware}:${POSTGRES_PASSWORD:-hoardware}@db:5432/${POSTGRES_DB:-hoardware}
  STORAGE_BACKEND: ${STORAGE_BACKEND:-auto}
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-20971520}
  MAX_FILE_BYTES: ${MAX_FILE_BYTES:-262144000}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_PREFIX: ${S3_PREFIX:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-14}
  BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
  BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
  BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-backups/}
  BACKUP_S3_ENDPOINT_URL: ${BACKUP_S3_ENDPOINT_URL:-}
  BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
  BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
  BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hoardware}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hoardware}
      POSTGRES_DB: ${POSTGRES_DB:-hoardware}
    volumes:
      # PostgreSQL 18+ images keep versioned data under /var/lib/postgresql.
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    restart: unless-stopped
    environment: *backend-env
    volumes:
      - photos:/data/photos
      - backups:/backups
      # Dataset files for `import-reference` (e.g. a CPU-DB checkout). Never committed.
      - ${REFERENCE_DATA_DIR:-./reference-data}:/reference-data:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

  # Scheduled pg_dump backups. Enable with: docker compose --profile backup up -d
  backup:
    profiles: ["backup"]
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.cli", "backup-loop"]
    environment: *backend-env
    volumes:
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  photos:
  backups:
